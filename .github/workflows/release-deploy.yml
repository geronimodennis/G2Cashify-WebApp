name: Deploy release to Cloudflare

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g2cashify-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy g2cashify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://g2cashify.com
    env:
      CLOUDFLARE_ACCOUNT_ID: 4e16aa1e200f3327f71b4deb6380e021
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check deployment authorization
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo '::error::Add the CLOUDFLARE_API_TOKEN repository secret, then re-run this workflow.'
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate website and Messenger handoff
        run: |
          npm run check
          node check-messenger.cjs
      - name: Deploy release assets
        run: npm run deploy
      - name: Check production website
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors https://g2cashify.com/ -o /tmp/g2cashify.html
          grep -q 'G2Cashify' /tmp/g2cashify.html
          echo 'Published successfully: https://g2cashify.com' >> "$GITHUB_STEP_SUMMARY"
